services:
  backend:
    build:
      context: ./backend
    container_name: taskflow-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: taskflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
